name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify built social UI and version wiring
        shell: bash
        run: |
          test -f dist/social-ui.js
          grep -q 'src="/social-ui.js"' dist/index.html
          VERSION=$(node -p "require('./package.json').version")
          grep -q "rabbit-home-version\" content=\"$VERSION\"" dist/index.html
